name: hildors_cockpit
description: Hildors holographic cockpit controller for Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/packs/tarot_major_v1/manifest.json
    - assets/images/hildors_logo.jpg
    - assets/images/p20_product_showcase.jpg
    - assets/videos/showcase/
    - assets/holopet/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
